omni_nav_controller:
  ros__parameters:
    # ------------------------------------------------------------
    # Topics
    # ------------------------------------------------------------
    cmd_vel_topic: /cmd_vel
    target_yaw_topic: /target_yaw
    odom_topic: /odometry/filtered
    scan_topic: /scan
    motor_velocity_topic: /motor_velocity
    rotate_cmd_topic: /rotate_cmd

    # ------------------------------------------------------------
    # Yaw source
    #
    # use_tf_yaw: true
    #   使用 TF: map -> base_link
    #   需要 map / AMCL / SLAM / 定位正常
    #
    # use_tf_yaw: false
    #   不使用 map
    #   只使用 /odometry/filtered 的 yaw
    # ------------------------------------------------------------
    use_tf_yaw: false

    yaw_frame: map
    base_frame: base_link
    tf_lookup_timeout: 0.03

    # use_tf_yaw=false 时，正常不会因为没有 map 停车
    # 但如果刚启动还没有收到 odom，仍会暂时停车，这是安全的
    stop_when_yaw_lost: true

    # ------------------------------------------------------------
    # Velocity mapping
    # 直行 / 后退优化：
    # - max_vy 降低
    # - min_start_vy 设为 0
    # - deadband_vy 增大
    # ------------------------------------------------------------
    scale_vx: 1800.0
    scale_vy: 1800.0

    sign_vx: 1.0
    sign_vy: 1.0

    max_vx: 1400.0
    max_vy: 600.0

    min_start_vx: 30.0
    min_start_vy: 0.0

    deadband_vx: 8.0
    deadband_vy: 20.0

    alpha_vx: 0.35
    alpha_vy: 0.20

    # ------------------------------------------------------------
    # Axis remap
    # ------------------------------------------------------------
    swap_xy: false
    invert_x: false
    invert_y: false

    # ------------------------------------------------------------
    # Timeout
    # ------------------------------------------------------------
    cmd_timeout: 0.5
    target_yaw_timeout: 0.5
    stop_on_cmd_timeout: true
    hold_last_target_yaw: false

    # false: /target_yaw 输入 rad
    # true : /target_yaw 输入 deg
    target_yaw_in_degrees: false

    # ------------------------------------------------------------
    # Obstacle slowdown
    # ------------------------------------------------------------
    enable_scan_obstacle: false
    safe_distance: 0.3
    obstacle_slowdown_ratio: 0.3
    obstacle_detect_count: 3
    obstacle_free_count: 5
    obstacle_front_ratio: 0.25
    slowdown_vx_only: true

    # ------------------------------------------------------------
    # Yaw-motion gate
    # odom 模式下也可以继续使用
    # 如果你发现直行时因为 yaw 误差导致不走，可以先关掉
    # ------------------------------------------------------------
    enable_yaw_motion_gate: true
    yaw_stop_threshold_deg: 15.0
    yaw_slow_threshold_deg: 5.0
    yaw_slow_min_scale: 0.15

    # ------------------------------------------------------------
    # Debug
    # ------------------------------------------------------------
    debug_log: true
    debug_print_every_ms: 1000
