zone1_runner:
  ros__parameters:
    # =========================
    # 基础话题 / 服务配置
    # =========================
    start_signal_topic: /start_signal
    odom_topic: /odometry/filtered
    cmd_vel_topic: /cmd_vel
    set_absolute_goal_service: /set_absolute_goal

    # =========================
    # CAN 配置
    # =========================
    # 第 2 个点到达视觉微调路点后、开始视觉微调前依次发送：
    #   CAN ID = 0x66, DATA = 0x03
    #   CAN ID = 0x77, DATA = 0x06
    # 发送 0x03 后等待 pre_vision_reset_delay_sec，再发布 reset_Weaponhead
    #
    # 第 2 个点收到第一次 /r1/weapon_done true，也就是夹取完成后依次发送：
    #   CAN ID = 0x77, DATA = 0x07
    #   CAN ID = 0x77, DATA = 0x20
    #
    # 第 4 个点收到 /r1/weapon_done true 后发送：
    #   CAN ID = 0x77
    #   DATA   = 0x07
    can_interface: can0
    enable_can_weapon_cmd: true
    can_command_gap_sec: 1.0
    pre_vision_reset_delay_sec: 5.0

    # =========================
    # 视觉相关话题
    # =========================
    # 保留旧视觉开始话题；当前武器头微调流程使用下面的 reset 字符串命令
    vision_start_topic: /vision_start

    # 视觉优先级
    # 第 2 个点开启
    # 收到第一次 weapon_done true 后关闭
    vision_priority_topic: /r1/vision_priority

    # 武器头识别结果话题，视觉发布字符串：
    #   "x:+0.1234,z:+0.5678"
    # 当前节点会发送两次 reset_Weaponhead：
    #   第一次 reset 会在 CAN 0x66/0x03 发送 5 秒后发布
    #   第一次收到 /vision/Weaponhead_Info 只解析横向偏移 x
    #   完成 x 方向微调移动后再次发布 reset_Weaponhead 重新识别
    #   第二次收到 /vision/Weaponhead_Info 只解析纵向偏移 z
    vision_cmd_topic: /vision/Weaponhead_Info

    # 武器头识别 reset 命令话题，当前节点发布 std_msgs/String：
    #   "reset_Weaponhead"
    vision_reset_cmd_topic: /vision/recognition_reset_cmd
    vision_reset_cmd_value: reset_Weaponhead

    # =========================
    # 武器完成反馈
    # =========================
    # 同一个话题发两次 true：
    #
    # 第一次 true：
    #   第 2 个点先发 0x66/0x03 和 0x77/0x06，再视觉微调完成后等待
    #   表示武器抓取完成
    #   收到后发送 0x07，间隔后发送 0x20，再前往下一个点
    #
    # 第二次 true：
    #   第 4 个点等待
    #   表示武器拼接完成
    #   收到后 zone1 发送 CAN 0x77/0x07
    weapon_done_topic: /r1/weapon_done

    # =========================
    # 武器任务点位配置
    # =========================
    # 注意：索引从 0 开始
    #
    # 第 1 个点 index = 0
    # 第 2 个点 index = 1
    # 第 3 个点 index = 2
    # 第 4 个点 index = 3
    # 第 5 个点 index = 4

    # 第 2 个点：
    # 到达后先发送 CAN 0x66/0x03 和 0x77/0x06
    # 0x03 发送 5 秒后发布第一次 reset_Weaponhead 并识别横向偏移 x
    # x 方向微调到位后，再次发布 reset_Weaponhead 重新识别纵向偏移 z
    # 然后视觉微调到点位
    # 然后等待第一次 /r1/weapon_done true
    # 收到 true 后发送 CAN 0x77/0x07 和 0x77/0x20，再前往下一个点
    weapon_grasp_vision_waypoint_index: 1

    # 第 4 个点：
    # 到达后等待第二次 /r1/weapon_done true
    # 收到后发送 CAN 0x77/0x07
    weapon_assemble_waypoint_index: 3

    # =========================
    # 导航参数
    # =========================
    nav_pos_tolerance: 0.2
    nav_yaw_tolerance: 1.0

    # 只用于武器头视觉微调，不影响普通导航路点。
    vision_fine_tune_pos_tolerance: 0.015
    vision_fine_tune_release_tolerance: 0.025

    max_nav_retries: 3

    # =========================
    # 视觉微调参数
    # =========================
    # 视觉微调完成后，进入等待第一次 true 前的等待时间
    post_vision_wait_sec: 1.0

    # =========================
    # 5 个路点配置
    # =========================
    # 下面只是示例坐标，请替换成你的真实 5 个点。
    #
    # 第 2 个点 weapon_grasp_vision：
    #   到达后先发 0x66/0x03 和 0x77/0x06，5 秒后 reset 识别 x，x 微调到位后再 reset 识别 z，视觉微调到位后等第一次 true
    #
    # 第 4 个点 weapon_assemble：
    #   到达后等第二次 true，收到后发 0x07
    #
    # 第 5 个点 wp5：
    #   任务结束点

    waypoints_x: [0.0,-0.6,-0.6,-1.56,-1.56]
    waypoints_y: [0.5,0.5,0.5,0.5,0.5]
    waypoints_yaw: [0.0, 0.0,3.14,3.14,1.57]

    waypoint_names:
      - wp1
      - weapon_grasp_vision
      - wp3
      - weapon_assemble
      - wp5
