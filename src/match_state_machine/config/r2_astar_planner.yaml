r2_astar_planner_node:
  ros__parameters:
    # ============================================================
    # Start
    # ============================================================
    start_block: 0
    start_yaw: 0

    # ============================================================
    # Block type
    # ============================================================
    type_empty: 0
    type_r1: 1
    type_r2: 2
    type_fake: 3
    type_unknown: -1

    # ============================================================
    # Passability
    # ============================================================
    allow_pass_r1: true
    allow_pass_fake: false

    # ============================================================
    # Graph
    # ============================================================
    neighbor_distance: 1.20
    neighbor_tolerance: 0.05

    # ============================================================
    # Movement cost
    # ============================================================
    cost_forward_flat: 1.0
    cost_reverse_flat: 1.5
    cost_turn_90: 2.0
    cost_climb_up: 6.0
    cost_reverse_down: 10.0

    cost_height_20: 0.0
    cost_height_40: 2.0
    cost_height_60: 8.0

    cost_start_to_block: 1.0
    cost_r1_wait: 0.0
    cost_fake_penalty: 100000.0
    cost_unknown_penalty: 1.0

    # ============================================================
    # R2 target planning
    # ============================================================
    target_count: 2

    auto_plan_when_update: true
    plan_when_r2_detected: true
    replan_when_fake_detected: true

    # 如果没有 /id_type 全部 12 个块的初始化信息，也允许规划
    wait_all_blocks_before_plan: false

    # ============================================================
    # 无 R2_KFS 时也规划
    # ============================================================
    plan_without_r2_target: true

    # 没识别到 R2_KFS 时，默认先探索的 block
    # 推荐：
    #   10：上路出口附近
    #   12：下路出口附近
    #   11：中间
    default_explore_target_block: 10

    # 启动后自动规划一次
    plan_once_on_start: true
    initial_plan_delay_ms: 500

    # ============================================================
    # Pickup support preference
    # ============================================================
    pickup_prefer_left_cost: -20.0
    pickup_prefer_bottom_cost: -18.0
    pickup_penalty_right_cost: 20.0
    pickup_penalty_top_cost: 18.0

    # ============================================================
    # Odometry
    # ============================================================
    odom_topic: /odometry/filtered
    block_half_size_m: 0.60

    # ============================================================
    # Vision KFS
    # ============================================================
    vision_kfs_topic: /vision/kfs_camera_xyz
    r1_type_prefix: R1_KFS
    r2_type_prefix: R2_KFS
    fake_type_prefix: FAKE_KFS

    # ============================================================
    # R1 wait
    # ============================================================
    lost_confirm_time: 2.5
    r1_monitor_period_ms: 50

    only_track_id_type_r1_block: false
    only_track_path_relevant_r1: true
    replan_after_r1_cleared: false
    use_current_block_as_replan_start: false
    r1_release_limit: 0
    locked_r1_refresh_radius_m: 0.55

    # ============================================================
    # Camera / gimbal
    # ============================================================
    camera_gimbal_state_topic: /camera_gimbal_look_backward

    camera_mount_offset_x_m: 0.32
    camera_mount_offset_z_m: 0.125

    camera_forward_offset_x_m: 0.06
    camera_forward_offset_y_m: -0.32
    camera_backward_offset_x_m: -0.06
    camera_backward_offset_y_m: 0.32

    use_odom_yaw_for_camera_transform: true
    backward_camera_x_positive_to_robot_left: false
