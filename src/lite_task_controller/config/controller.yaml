lite_task_controller:
  ros__parameters:
    odom_topic: /odometry/filtered
    cmd_vel_topic: /cmd_vel
    target_yaw_topic: /target_yaw
    status_topic: /lite_task_status
    camera_gimbal_state_topic: /camera_gimbal_look_backward

    # ------------------------------------------------------------
    # R2 Dijkstra 路径订阅
    # ------------------------------------------------------------
    r2_planned_path_topic: /r2_planned_path
    r2_action_sequence_topic: /r2_action_sequence

    enable_r2_path_subscribe: true
    clear_queue_when_new_r2_path: true
    cancel_active_goal_when_new_r2_path: false

    # ------------------------------------------------------------
    # R1 KFS 等待/清除
    # ------------------------------------------------------------
    r2_wait_for_r1_topic: /r2_wait_for_r1_kfs
    r2_r1_cleared_topic: /r2_r1_kfs_cleared
    enable_r1_wait_subscribe: true

    # ------------------------------------------------------------
    # R2 yaw
    # ------------------------------------------------------------
    r2_default_yaw: 0.0
    r2_back_to_stair_yaw: 3.1415926

    control_frequency: 30.0

    # ------------------------------------------------------------
    # Pickup / CAN / arm
    # ------------------------------------------------------------
    step_cmd_topic: /step_cmd
    arm_grab_done_topic: /arm_grab_done
    pickup_vision_offset_topic: /vision/left_arm/snapshot_offset_avg

    can_interface: can0
    enable_can_step_cmd: true

    enable_pickup_action: true
    pickup_forward_distance: 0.20
    pickup_forward_speed: 0.06
    pickup_reverse_speed: 0.06
    pickup_yaw_match_tolerance: 0.35

    # ------------------------------------------------------------
    # PD 参数
    # 前进维持比较正常的响应，横向增强。
    # ------------------------------------------------------------
    k_forward: 1.45
    k_lateral: 0.75
    kd_forward: 0.06
    kd_lateral: 0.10
    kw: 0.6

    # ------------------------------------------------------------
    # 最大速度
    # 前进别太猛，横向比之前放开。
    # ------------------------------------------------------------
    forward_max: 0.48
    lateral_max: 0.34
    wz_max: 0.16

    # ------------------------------------------------------------
    # 小速度死区 / 横向死区
    # 横向死区降到 1.5cm，避免末端和视觉纠偏被吃掉。
    # ------------------------------------------------------------
    forward_min: 0.0
    lateral_min: 0.0
    lateral_stop_tolerance: 0.015

    enable_straight_lateral_lock: false
    straight_lateral_lock_goal_tolerance: 0.100
    straight_lateral_lock_max_lateral_ratio: 0.15
    straight_lateral_lock_min_forward: 0.20
    straight_lateral_finish_tolerance: 0.070

    enable_yaw_lateral_feedforward: true
    yaw_lateral_feedforward_gain: 0.35
    yaw_lateral_feedforward_max: 0.06

    enable_r2_lane_drive: true

    # ------------------------------------------------------------
    # 减速区和到点容差
    # slow_down_radius 不要太大，否则横向也会被拖慢。
    # 代码里会额外保证横向 scale 不低于 0.55。
    # ------------------------------------------------------------
    slow_down_radius: 0.45
    pos_tolerance: 0.075
    pos_release_tolerance: 0.125
    yaw_tolerance: 0.045

    pos_stable_time: 0.20
    yaw_stable_time: 0.18
    hold_time: 0.08

    # ------------------------------------------------------------
    # 到 block0 后发 CAN 0x01 后等待
    # ------------------------------------------------------------
    block0_after_open_wait_sec: 1.0

    # ------------------------------------------------------------
    # 预对齐阈值
    # ------------------------------------------------------------
    pre_align_yaw_threshold: 6.30

    publish_angular_z: false
    keep_yaw_during_move: true
    use_current_yaw_as_move_target: true

    # ------------------------------------------------------------
    # Debug
    # ------------------------------------------------------------
    debug_log: true
    debug_safe_mode: false
    debug_force_zero_angular_z: false
    debug_print_every_ms: 1000

    debug_safe_forward_max: 0.30
    debug_safe_lateral_max: 0.15
    debug_safe_wz_max: 0.15

    # ------------------------------------------------------------
    # 超时
    # ------------------------------------------------------------
    enable_goal_timeout: true
    goal_timeout_sec: 120.0

    # ------------------------------------------------------------
    # 坐标/命令符号
    # ------------------------------------------------------------
    control_forward_sign: 1.0
    control_lateral_sign: 1.0

    display_forward_sign: -1.0
    display_lateral_sign: -1.0

    cmd_x_sign: 1.0
    cmd_y_sign: 1.0

    # ------------------------------------------------------------
    # x 慢速区
    # 注意：代码会改成只缩放 linear.x，不再缩放 linear.y。
    # ------------------------------------------------------------
    enable_x_slow_zone: true
    x_slow_zone_min: 2.0
    x_slow_zone_max: 7.5
    x_slow_zone_scale: 0.25
    x_slow_zone_hysteresis: 0.05
    x_slow_scale_angular: true

    # ------------------------------------------------------------
    # x 坡道提速区
    # 注意：代码会改成只 boost linear.x，不再 boost linear.y。
    # ------------------------------------------------------------
    enable_x_boost_zone: true
    x_boost_zone_min: 8.195
    x_boost_zone_max: 10.595
    x_boost_zone_scale: 1.15
    x_boost_zone_hysteresis: 0.05
    x_boost_scale_angular: false

    # ------------------------------------------------------------
    # 旧常速区关闭
    # ------------------------------------------------------------
    enable_constant_x_speed_zone: false
    constant_x_speed_zone_min: 1.0
    constant_x_speed_zone_max: 7.5
    constant_x_speed_value: 200.0

    # ------------------------------------------------------------
    # 加速度限制
    # 前进适中，横向放开到 0.55。
    # ------------------------------------------------------------
    enable_acc_limit: true
    max_acc_x: 0.75
    max_acc_y: 0.55
    max_acc_wz: 0.25

    # ------------------------------------------------------------
    # 误差限幅
    # 横向放开到 0.80，避免大横向误差时太弱。
    # ------------------------------------------------------------
    max_forward_error_for_control: 1.5
    max_lateral_error_for_control: 0.80

    # ------------------------------------------------------------
    # 最小接近速度
    # boost_lateral=true，让横向末端也能获得最低速度补偿。
    # ------------------------------------------------------------
    enable_min_approach_speed: true
    min_approach_linear_speed: 0.025
    min_slow_scale: 0.28
    min_approach_boost_lateral: true

    # ------------------------------------------------------------
    # 卡住释放
    # ------------------------------------------------------------
    enable_stuck_release: true
    stuck_release_time: 0.70
    progress_epsilon: 0.003

    # ------------------------------------------------------------
    # Vision lateral correction
    # ------------------------------------------------------------
    enable_vision_lateral_correction: true

    vision_alignment_request_topic: /vision/alignment/request
    vision_recognition_reset_topic: /vision/recognition_reset_cmd

    left_snapshot_offset_topic: /vision/left_arm/snapshot_offset_avg
    right_snapshot_offset_topic: /vision/right_arm/snapshot_offset_avg

    lateral_correction_cmd_topic: /lite_task_controller/lateral_correction_cmd

    vision_lateral_k: 0.85
    vision_lateral_tolerance: 0.015
    vision_lateral_max: 0.20
    vision_lateral_min: 0.0
    vision_lateral_stable_time: 0.20
    vision_offset_timeout: 2.0

    # 如果视觉纠偏方向反了，只改这个为 1.0
    vision_lateral_sign: -1.0

    auto_publish_reset_kfs_after_lateral_done: true

